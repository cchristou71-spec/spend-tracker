<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#3d8b8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spend Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Spend Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f1ec; --surface:#fff; --card:#faf8f5;
    --border:#e2ddd6; --border2:#cdc8bf;
    --teal:#3d8b8b; --teal-l:#5aabab; --teal-d:#a8cece; --teal-bg:#eaf4f4;
    --text:#2c2a27; --muted:#8a857d; --muted2:#b5b0a8;
    --red:#c0513e; --red-bg:#fdf0ee;
    --green:#3a8c5c; --green-bg:#edf6f1;
    --amber:#c07830; --amber-bg:#fdf5ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;padding:24px 14px 80px;max-width:600px;margin:0 auto}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  input[type=number]{-moz-appearance:textfield}
  .hdr{text-align:center;margin-bottom:24px}
  .hdr h1{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,8vw,46px);font-weight:700;color:var(--teal)}
  .hdr p{color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(61,139,139,0.06)}
  .fx{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--teal-bg);border:1px solid var(--teal-d);border-radius:8px;padding:7px 14px;margin-bottom:16px;font-size:11px;color:var(--muted)}
  .fx b{color:var(--teal)}
  .budget-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .budget-row label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .budget-row input{font-family:'DM Mono',monospace;font-size:14px;background:var(--card);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:7px 10px;width:130px}
  .budget-row input:focus{border-color:var(--teal-l);outline:none}
  .btn{font-family:'DM Mono',monospace;font-size:11px;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;letter-spacing:1px;transition:opacity .2s}
  .btn:active{opacity:.7}
  .btn-teal{background:var(--teal);color:#fff}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}
  .ys{position:relative;overflow:hidden}
  .ys::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal-d),var(--teal),var(--teal-d))}
  .ys h2{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:700;color:var(--teal);letter-spacing:3px;text-transform:uppercase;margin-bottom:2px;margin-top:4px}
  .period{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);margin-bottom:18px}
  .sec-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:10px;padding-bottom:3px;border-bottom:1px solid var(--teal-bg)}
  .bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .bal-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
  .bal-item .lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .bal-item .val{font-size:15px;font-weight:500;color:var(--text)}
  .bal-total{background:var(--teal-bg);border:1px solid var(--teal-d);border-radius:10px;padding:12px;text-align:center;margin-top:2px}
  .bal-total .lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
  .bal-total .val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--teal)}
  .bal-total .sub{font-size:10px;color:var(--muted);margin-top:2px}
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0}
  .spend-tbl{width:100%;border-collapse:collapse;font-size:12px}
  .spend-tbl th{padding:5px 6px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);text-align:left}
  .spend-tbl th:not(:first-child){text-align:right}
  .spend-tbl td{padding:7px 6px;border-bottom:1px solid var(--border)}
  .spend-tbl td:not(:first-child){text-align:right}
  .spend-tbl tr:last-child td{border-bottom:none}
  .spend-tbl tr:hover td{background:var(--card)}
  .annual-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .annual-box{flex:1;min-width:120px;border-radius:10px;padding:12px 10px;text-align:center}
  .annual-box .lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
  .annual-box .val{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700}
  .annual-box .sub{font-size:10px;color:var(--muted);margin-top:2px}
  .box-amber{background:var(--amber-bg);border:1px solid #e8c898}
  .box-amber .lbl{color:var(--amber)} .box-amber .val{color:var(--amber)}
  .box-green{background:var(--green-bg);border:1px solid #a8d8b8}
  .box-green .lbl{color:var(--green)} .box-green .val{color:var(--green)}
  .box-red{background:var(--red-bg);border:1px solid #e8b8b0}
  .box-red .lbl{color:var(--red)} .box-red .val{color:var(--red)}
  .controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .controls select{font-family:'DM Mono',monospace;font-size:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 10px;cursor:pointer}
  .entry-form{background:var(--surface);border:1px solid var(--teal-d);border-radius:12px;padding:16px;margin-bottom:16px;animation:slideDown .25s ease}
  @keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid.single-col{grid-template-columns:1fr}
  .form-group label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .form-group input{font-family:'DM Mono',monospace;font-size:15px;background:var(--card);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:9px 10px;width:100%}
  .form-group input:focus{border-color:var(--teal-l);outline:none}
  .shop-note{font-size:10px;color:var(--teal);margin-top:3px}
  .form-actions{display:flex;gap:10px;margin-top:14px}
  .month-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,0.04);transition:border-color .2s}
  .month-card:hover{border-color:var(--teal-d)}
  .month-hdr{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:var(--card);cursor:pointer;user-select:none}
  .month-hdr .name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--teal)}
  .month-hdr .spend{font-size:15px;font-weight:500;color:var(--amber)}
  .month-hdr .chev{color:var(--muted2);font-size:11px;transition:transform .25s}
  .month-hdr.open .chev{transform:rotate(180deg)}
  .month-body{display:none;border-top:1px solid var(--border)}
  .month-body.open{display:block}
  .acct-list{padding:4px 0}
  .acct-row{padding:10px 14px;border-bottom:1px solid var(--border)}
  .acct-row:last-child{border-bottom:none}
  .acct-row .acct-hdr{display:flex;justify-content:space-between;align-items:center}
  .acct-row .acct-name{font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px}
  .month-totals{background:var(--teal-bg);border-top:1px solid var(--teal-d);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .month-totals .tot{text-align:center}
  .month-totals .tot .lbl{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);margin-bottom:1px}
  .month-totals .tot .val{font-size:16px;font-weight:500}
  .month-actions{padding:8px 14px;background:var(--card);border-top:1px solid var(--border);text-align:right}
  .edit-btn{font-family:'DM Mono',monospace;font-size:9px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:4px 10px;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
  .edit-btn:hover{border-color:var(--teal-d);color:var(--teal)}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:12px;letter-spacing:1px}
  .empty .icon{font-size:34px;margin-bottom:12px;opacity:.4}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--teal);color:#fff;font-family:'DM Mono',monospace;font-size:12px;padding:10px 20px;border-radius:8px;font-weight:500;letter-spacing:1px;transition:transform .3s;z-index:100;white-space:nowrap;box-shadow:0 4px 16px rgba(61,139,139,.3);pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .status{font-size:9px;color:var(--teal-l);letter-spacing:1.5px;text-transform:uppercase;text-align:center;margin-top:4px;min-height:14px}
  .yr-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .yr-row label{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
  .yr-row select{font-family:'DM Mono',monospace;font-size:13px;background:var(--surface);border:1px solid var(--border);color:var(--teal);border-radius:6px;padding:5px 10px;cursor:pointer}
  .loading{text-align:center;padding:40px;color:var(--muted);font-size:12px;letter-spacing:2px}
</style>
</head>
<body>

<div class="hdr">
  <h1>Spend Tracker</h1>
  <p>Monthly Balance &amp; Spend Analysis</p>
  <div class="status" id="statusMsg"></div>
</div>

<div class="fx">
  <span>Shop in euros · fixed rate:</span>
  <b>1 EUR = £0.86</b>
</div>

<div class="card">
  <div class="budget-row">
    <label>Annual Budget (£)</label>
    <input type="number" id="budgetInput" step="100" placeholder="e.g. 60000">
    <button class="btn btn-teal" onclick="saveBudget()">Set</button>
    <span id="budgetDisplay" style="font-size:11px;color:var(--muted)"></span>
  </div>
</div>

<div class="yr-row">
  <label>Year</label>
  <select id="yearSelect" onchange="changeYear()"></select>
  <button class="btn btn-ghost" id="retrySyncBtn" onclick="retrySync()" style="display:none">↻ Retry Sync</button>
</div>

<div class="card ys">
  <h2>● Year to Date</h2>
  <div class="period">Month end April 2026 → Month end March 2027</div>
  <div class="sec-label">Cumulative Spend — Month by Month</div>
  <div id="spendList"></div>
  <div id="annualRow" style="display:none" class="annual-row">
    <div class="annual-box box-amber">
      <div class="lbl">Annual Spend</div>
      <div class="val" id="ab-spend">£—</div>
      <div class="sub" id="ab-months"></div>
    </div>
    <div class="annual-box" id="remainBox">
      <div class="lbl" id="remainLbl">Remaining Budget</div>
      <div class="val" id="ab-remain">£—</div>
      <div class="sub" id="ab-budgetsub"></div>
    </div>
  </div>
  <div id="annualNoBudget" style="display:none;text-align:center;margin-top:14px">
    <div style="font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--amber)" id="ab-spend2">£—</div>
    <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-top:2px">Annual Spend</div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px" id="ab-months2"></div>
  </div>
</div>

<div class="controls">
  <select id="monthSelect"></select>
  <button class="btn btn-teal" onclick="toggleForm()">+ Add / Edit</button>
</div>

<div class="entry-form" id="entryForm" style="display:none">
  <div class="sec-label" id="formTitle" style="margin-bottom:14px"></div>
  <div class="form-grid">
    <div class="form-group">
      <label><span class="dot" style="background:#3a6ea8;margin-right:5px"></span>Lloyd's (£)</label>
      <input type="number" id="f-lloyds" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
    <div class="form-group">
      <label><span class="dot" style="background:#3a8c5c;margin-right:5px"></span>Savings (£)</label>
      <input type="number" id="f-savings" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
    <div class="form-group">
      <label><span class="dot" style="background:#c07830;margin-right:5px"></span>Shop (€)</label>
      <input type="number" id="f-shop" step="0.01" placeholder="0.00" inputmode="decimal" oninput="updateShopPreview()">
      <div class="shop-note" id="shopPreview">€ × 0.86 = £</div>
    </div>
    <div class="form-group">
      <label><span class="dot" style="background:#7a5fa8;margin-right:5px"></span>NSi (£)</label>
      <input type="number" id="f-nsi" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
  </div>
  <div class="form-grid single-col" style="margin-top:12px">
    <div class="form-group">
      <label><span class="dot" style="background:#2a9d8f;margin-right:5px"></span>Cos Vanguard (£)</label>
      <input type="number" id="f-cosvanguard" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
    <div class="form-group">
      <label><span class="dot" style="background:#e76f51;margin-right:5px"></span>Carolyn Vanguard (£)</label>
      <input type="number" id="f-carolynvanguard" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
    <div class="form-group">
      <label><span class="dot" style="background:#d4a017;margin-right:5px"></span>Cos Wealthify (£)</label>
      <input type="number" id="f-coswealthify" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
    <div class="form-group">
      <label><span class="dot" style="background:#a05c7a;margin-right:5px"></span>Carolyn Wealthify (£)</label>
      <input type="number" id="f-carolynwealthify" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn-teal" onclick="saveMonth()">Save Entry</button>
    <button class="btn btn-ghost" onclick="hideForm()">Cancel</button>
  </div>
</div>

<div id="monthsList"></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://lpfifbhoglnlrntfqjxq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwZmlmYmhvZ2xubHJudGZxanhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTkzMzMsImV4cCI6MjA5MzU5NTMzM30.slcTjntVCrhpo07mkstwQvdWfm-L046Ej1tZe2TF5LI';
const HEADERS = {'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ACCOUNTS = ['lloyds','savings','shop','nsi','cosvanguard','carolynvanguard','coswealthify','carolynwealthify'];
const ACCT_LABELS = {lloyds:"Lloyd's",savings:'Savings',shop:'Shop',nsi:'NSi',cosvanguard:'Cos Vanguard',carolynvanguard:'Carolyn Vanguard',coswealthify:'Cos Wealthify',carolynwealthify:'Carolyn Wealthify'};
const ACCT_COLORS = {lloyds:'#3a6ea8',savings:'#3a8c5c',shop:'#c07830',nsi:'#7a5fa8',cosvanguard:'#2a9d8f',carolynvanguard:'#e76f51',coswealthify:'#d4a017',carolynwealthify:'#a05c7a'};
const SHOP_FX = 0.86;

let selectedYear = new Date().getFullYear();
let cachedData = {};   // { monthName: rowObject }
let cachedBudget = null;
let usingOfflineBackup = false;

// ── Local backup helpers ──────────────────────────────────
function backupKey(year) { return 'spend_backup_' + year; }
function saveLocalBackup(year, data, budget) {
  try {
    localStorage.setItem(backupKey(year), JSON.stringify({data, budget, savedAt: new Date().toISOString()}));
  } catch(e) { console.error('Local backup failed', e); }
}
function loadLocalBackup(year) {
  try {
    const raw = localStorage.getItem(backupKey(year));
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

// ── Supabase helpers ──────────────────────────────────────
async function sbGet(table, params) {
  try {
    const url = `${SUPABASE_URL}/rest/v1/${table}?${params}`;
    const r = await fetch(url, {headers:{...HEADERS,'Accept':'application/json'}});
    return r.json();
  } catch(e) {
    alert('Get error: ' + e.message);
    return [];
  }
}
async function sbDelete(table, params) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, {
      method:'DELETE',
      headers:{...HEADERS}
    });
    return r.ok;
  } catch(e) {
    alert('Delete error: ' + e.message);
    return false;
  }
}
async function sbInsert(table, body) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method:'POST',
      headers:{...HEADERS,'Prefer':'return=minimal'},
      body: JSON.stringify(body)
    });
    const text = await r.text();
    if (!r.ok) { alert('Error ' + r.status + ': ' + text); }
    return r.ok;
  } catch(e) {
    alert('Network error: ' + e.message);
    return false;
  }
}

// ── Load all data for year ────────────────────────────────
async function loadYear(year) {
  setStatus('Loading…');
  try {
    const [rows, budgets] = await Promise.all([
      sbGet('spend_tracker', `year=eq.${year}&select=*`),
      sbGet('spend_budget',  `year=eq.${year}&select=*`)
    ]);
    if (!Array.isArray(rows)) throw new Error('Bad response');
    cachedData = {};
    (rows||[]).forEach(r => { cachedData[r.month] = r; });
    cachedBudget = budgets?.[0]?.budget || null;
    usingOfflineBackup = false;
    // Write local backup on every successful cloud load
    saveLocalBackup(year, cachedData, cachedBudget);

    if (cachedBudget) {
      document.getElementById('budgetInput').value = cachedBudget;
      document.getElementById('budgetDisplay').textContent = 'Budget: ' + fmt(cachedBudget);
    } else {
      document.getElementById('budgetInput').value = '';
      document.getElementById('budgetDisplay').textContent = '';
    }
    setStatus('');
    renderAll();
  } catch(e) {
    console.error(e);
    // Fall back to local backup
    const backup = loadLocalBackup(year);
    if (backup) {
      cachedData = backup.data || {};
      cachedBudget = backup.budget || null;
      usingOfflineBackup = true;
      if (cachedBudget) {
        document.getElementById('budgetInput').value = cachedBudget;
        document.getElementById('budgetDisplay').textContent = 'Budget: ' + fmt(cachedBudget);
      }
      setStatus('⚠ Offline — showing local backup from ' + new Date(backup.savedAt).toLocaleString('en-GB'));
      renderAll();
    } else {
      setStatus('⚠ Could not connect, no local backup available');
    }
  }
}

// Also load previous December for spend calc
async function getPrevDec() {
  try {
    const rows = await sbGet('spend_tracker', `year=eq.${selectedYear-1}&month=eq.December&select=*`);
    return rows?.[0] || null;
  } catch { return null; }
}

// ── Save month ────────────────────────────────────────────
async function saveMonthToDb(key, entry) {
  setStatus('Saving…');

  // Always update local backup immediately — this is the safety net
  const tentativeData = {...cachedData, [key]: {...entry, month:key, year:selectedYear, shop_eur:entry.shopEur}};
  saveLocalBackup(selectedYear, tentativeData, cachedBudget);

  // Delete existing row for this year/month first
  await sbDelete('spend_tracker', `year=eq.${selectedYear}&month=eq.${encodeURIComponent(key)}`);
  const ok = await sbInsert('spend_tracker', {
    id: crypto.randomUUID(),
    year: selectedYear,
    month: key,
    lloyds: entry.lloyds,
    savings: entry.savings,
    shop: entry.shop,
    shop_eur: entry.shopEur,
    nsi: entry.nsi,
    cosvanguard: entry.cosvanguard,
    carolynvanguard: entry.carolynvanguard,
    coswealthify: entry.coswealthify,
    carolynwealthify: entry.carolynwealthify,
    saved_at: new Date().toISOString()
  });
  if (ok) {
    cachedData[key] = {...entry, month: key, year: selectedYear, shop_eur: entry.shopEur};
    saveLocalBackup(selectedYear, cachedData, cachedBudget); // re-sync backup with confirmed cloud state
    setStatus('Saved ✓');
    setTimeout(()=>setStatus(''), 2000);
    renderAll();
    showToast(key + ' saved ✓');
  } else {
    // Cloud save failed but local backup already has this entry — use it so nothing is lost on screen
    cachedData[key] = {...entry, month: key, year: selectedYear, shop_eur: entry.shopEur};
    usingOfflineBackup = true;
    setStatus('⚠ Cloud save failed — saved to local backup only');
    renderAll();
    showToast(key + ' saved locally (cloud failed)');
  }
}

// ── Save budget ───────────────────────────────────────────
async function saveBudget() {
  const v = parseFloat(document.getElementById('budgetInput').value);
  if (!v || v<=0) { showToast('Enter a valid budget'); return; }
  setStatus('Saving…');
  saveLocalBackup(selectedYear, cachedData, v); // local safety net first
  await sbDelete('spend_budget', `year=eq.${selectedYear}`);
  const ok = await sbInsert('spend_budget', {year: selectedYear, budget: v});
  if (ok) {
    cachedBudget = v;
    document.getElementById('budgetDisplay').textContent = 'Budget: ' + fmt(v);
    setStatus('Saved ✓');
    setTimeout(()=>setStatus(''), 2000);
    renderAll();
    showToast('Budget set ✓');
  } else {
    cachedBudget = v;
    usingOfflineBackup = true;
    document.getElementById('budgetDisplay').textContent = 'Budget: ' + fmt(v) + ' (local only)';
    setStatus('⚠ Cloud save failed — saved to local backup only');
    renderAll();
    showToast('Budget saved locally (cloud failed)');
  }
}

// ── Helpers ───────────────────────────────────────────────
function fmt(n) {
  if (n==null||isNaN(n)) return '—';
  return (n<0?'-':'')+'£'+Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fabs(n) {
  if (n==null||isNaN(n)) return '—';
  return '£'+Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function feur(n) { return '€'+Math.abs(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function setStatus(msg) { document.getElementById('statusMsg').textContent = msg; }
function getVal(row, a) {
  return parseFloat(row[a]) || 0;
}

// ── Init ──────────────────────────────────────────────────
function init() {
  const cur = new Date().getFullYear();
  const ys = document.getElementById('yearSelect');
  for (let y=cur-3;y<=cur+1;y++) {
    const o=document.createElement('option');
    o.value=y; o.textContent=y; if(y===selectedYear) o.selected=true;
    ys.appendChild(o);
  }
  const ms = document.getElementById('monthSelect');
  MONTHS.forEach((m,i) => {
    const o=document.createElement('option');
    o.value=i; o.textContent=m; if(i===new Date().getMonth()) o.selected=true;
    ms.appendChild(o);
  });
  loadYear(selectedYear);
}

function changeYear() {
  selectedYear = parseInt(document.getElementById('yearSelect').value);
  hideForm();
  loadYear(selectedYear);
}

// ── Form ──────────────────────────────────────────────────
function toggleForm() {
  const f = document.getElementById('entryForm');
  if (f.style.display==='none') showForm(); else hideForm();
}
function showForm() {
  const mi = parseInt(document.getElementById('monthSelect').value);
  const key = MONTHS[mi];
  const ex = cachedData[key] || {};
  document.getElementById('formTitle').textContent = 'Closing Balances — '+key+' '+selectedYear;
  document.getElementById('f-lloyds').value         = ex.lloyds         || '';
  document.getElementById('f-savings').value        = ex.savings        || '';
  document.getElementById('f-shop').value           = ex.shop_eur       || '';
  document.getElementById('f-nsi').value            = ex.nsi            || '';
  document.getElementById('f-cosvanguard').value    = ex.cosvanguard    || '';
  document.getElementById('f-carolynvanguard').value= ex.carolynvanguard|| '';
  document.getElementById('f-coswealthify').value   = ex.coswealthify   || '';
  document.getElementById('f-carolynwealthify').value= ex.carolynwealthify|| '';
  updateShopPreview();
  document.getElementById('entryForm').style.display = 'block';
}
function hideForm() { document.getElementById('entryForm').style.display='none'; }

function updateShopPreview() {
  const v = parseFloat(document.getElementById('f-shop').value);
  document.getElementById('shopPreview').textContent = v ? feur(v)+' × 0.86 = '+fabs(v*SHOP_FX) : '€ × 0.86 = £';
}

function saveMonth() {
  const mi = parseInt(document.getElementById('monthSelect').value);
  const key = MONTHS[mi];
  const shopEur = parseFloat(document.getElementById('f-shop').value)||0;
  const entry = {
    lloyds:           parseFloat(document.getElementById('f-lloyds').value)||0,
    savings:          parseFloat(document.getElementById('f-savings').value)||0,
    shopEur,          shop: parseFloat((shopEur*SHOP_FX).toFixed(2)),
    nsi:              parseFloat(document.getElementById('f-nsi').value)||0,
    cosvanguard:      parseFloat(document.getElementById('f-cosvanguard').value)||0,
    carolynvanguard:  parseFloat(document.getElementById('f-carolynvanguard').value)||0,
    coswealthify:     parseFloat(document.getElementById('f-coswealthify').value)||0,
    carolynwealthify: parseFloat(document.getElementById('f-carolynwealthify').value)||0,
  };
  hideForm();
  saveMonthToDb(key, entry);
}

// ── Render ────────────────────────────────────────────────
function renderAll() {
  renderSummary();
  renderMonths();
  const btn = document.getElementById('retrySyncBtn');
  if (btn) btn.style.display = usingOfflineBackup ? 'inline-block' : 'none';
}

// ── Retry syncing local backup up to Supabase ──────────────
async function retrySync() {
  setStatus('Syncing…');
  let allOk = true;
  for (const month of Object.keys(cachedData)) {
    const entry = cachedData[month];
    const payload = {
      id: crypto.randomUUID(),
      year: selectedYear,
      month,
      lloyds: entry.lloyds || 0,
      savings: entry.savings || 0,
      shop: entry.shop || 0,
      shop_eur: entry.shop_eur || entry.shopEur || 0,
      nsi: entry.nsi || 0,
      cosvanguard: entry.cosvanguard || 0,
      carolynvanguard: entry.carolynvanguard || 0,
      coswealthify: entry.coswealthify || 0,
      carolynwealthify: entry.carolynwealthify || 0,
      saved_at: new Date().toISOString()
    };
    await sbDelete('spend_tracker', `year=eq.${selectedYear}&month=eq.${encodeURIComponent(month)}`);
    const ok = await sbInsert('spend_tracker', payload);
    if (!ok) allOk = false;
  }
  if (cachedBudget) {
    await sbDelete('spend_budget', `year=eq.${selectedYear}`);
    const ok = await sbInsert('spend_budget', {year: selectedYear, budget: cachedBudget});
    if (!ok) allOk = false;
  }
  if (allOk) {
    usingOfflineBackup = false;
    setStatus('Synced to cloud ✓');
    setTimeout(()=>setStatus(''), 2500);
    showToast('All data synced to cloud ✓');
    renderAll();
  } else {
    setStatus('⚠ Sync incomplete — some entries failed');
  }
}

function renderSummary() {
  const data = cachedData;
  const budget = cachedBudget;

  // Spend rows — exclude current month only if no data entered for it
  let running=0, months=0; const rows=[];
  const currentMonth = new Date().getMonth();
  for (let i=0;i<12;i++) {
    const cur=data[MONTHS[i]];
    if (!cur) continue; // skip if no data entered
    if (i === currentMonth && !cur) continue; // exclude current month only if empty (redundant but explicit)
    const prev = i>0 ? data[MONTHS[i-1]] : null; if(!prev) continue;
    months++;
    const curTotal  = ACCOUNTS.reduce((s,a)=>s+getVal(cur,a),0);
    const prevTotal = ACCOUNTS.reduce((s,a)=>s+getVal(prev,a),0);
    const diff = prevTotal - curTotal;
    const spend = diff > 0 ? diff : 0;
    running += spend;
    rows.push({month:MONTHS[i], rawDiff: diff, spend, cumulative:running});
  }

  const sl = document.getElementById('spendList');
  if (!rows.length) {
    sl.innerHTML='<div style="color:var(--muted);font-size:11px;text-align:center;padding:8px 0">Enter at least two months to see spend.</div>';
  } else {
    sl.innerHTML=`<table class="spend-tbl">
      <thead><tr><th>Month</th><th>Spend</th><th>Cumulative</th></tr></thead>
      <tbody>${[...rows].reverse().map(r=>`<tr>
        <td style="color:var(--muted);font-size:11px">${r.month}</td>
        <td style="text-align:right;font-weight:500;color:${r.rawDiff>0?'var(--amber)':'var(--green)'}">${r.rawDiff>0?fabs(r.spend):'savings'}</td>
        <td style="text-align:right;color:var(--teal);font-weight:500">${fabs(r.cumulative)}</td>
      </tr>`).join('')}</tbody></table>`;
  }

  const annRow = document.getElementById('annualRow');
  const annNo  = document.getElementById('annualNoBudget');
  if (!rows.length) { annRow.style.display='none'; annNo.style.display='none'; return; }
  const ml = months+' month'+(months>1?'s':'')+' of data';

  if (budget) {
    annRow.style.display='flex'; annNo.style.display='none';
    document.getElementById('ab-spend').textContent = fabs(running);
    document.getElementById('ab-months').textContent = ml;
    const rem = budget - running;
    const rb = document.getElementById('remainBox');
    rb.className = 'annual-box '+(rem>=0?'box-green':'box-red');
    document.getElementById('remainLbl').textContent = rem>=0?'Remaining Budget':'Over Budget';
    document.getElementById('ab-remain').textContent = fabs(Math.abs(rem));
    document.getElementById('ab-budgetsub').textContent = 'Budget: '+fmt(budget);
  } else {
    annRow.style.display='none'; annNo.style.display='block';
    document.getElementById('ab-spend2').textContent = fabs(running);
    document.getElementById('ab-months2').textContent = ml;
  }
}

function renderMonths() {
  const data = cachedData;
  const list = document.getElementById('monthsList');
  list.innerHTML='';
  const entries=[];
  for(let i=11;i>=0;i--) { if(data[MONTHS[i]]) entries.push({idx:i,month:MONTHS[i],cur:data[MONTHS[i]]}); }

  if (!entries.length) {
    list.innerHTML='<div class="empty"><div class="icon">📊</div><div>No entries yet for '+selectedYear+'.<br>Select a month and tap <b>+ Add / Edit</b>.</div></div>';
    return;
  }

  entries.forEach(({idx,month,cur}) => {
    const prev = idx>0 ? data[MONTHS[idx-1]] : null;
    const totalClosing = ACCOUNTS.reduce((s,a)=>s+getVal(cur,a),0);
    const prevTotal = prev ? ACCOUNTS.reduce((s,a)=>s+getVal(prev,a),0) : null;
    const diff = prev ? prevTotal - totalClosing : null;
    const totalSpend = diff != null ? (diff > 0 ? diff : 0) : null;
    const isSavings = diff != null && diff <= 0;

    const acctRows = ACCOUNTS.map(a => {
      return `<div class="acct-row">
        <div class="acct-hdr">
          <div class="acct-name">
            <span class="dot" style="background:${ACCT_COLORS[a]}"></span>
            ${ACCT_LABELS[a]}
            ${a==='shop'?`<span style="font-size:10px;color:var(--muted);font-weight:400">&nbsp;${feur(cur.shop_eur)}</span>`:''}
          </div>
          <div style="font-size:13px;font-weight:500;color:var(--text)">${fmt(getVal(cur,a))}</div>
        </div>
      </div>`;
    }).join('');

    const card = document.createElement('div');
    card.className='month-card';
    card.innerHTML=`
      <div class="month-hdr" id="hdr-${idx}" onclick="toggleCard(${idx})">
        <span class="name">${month} ${selectedYear}</span>
        <span class="spend" style="color:${isSavings?'var(--green)':'var(--amber)'}">${diff==null?'—':isSavings?'Savings':fabs(totalSpend)}</span>
        <span class="chev">▼</span>
      </div>
      <div class="month-body" id="body-${idx}">
        <div class="acct-list">${acctRows}</div>
        <div class="month-totals">
          <div class="tot">
            <div class="lbl">Total Balance</div>
            <div class="val" style="color:var(--teal)">${fmt(totalClosing)}</div>
          </div>
          ${diff!=null?`<div class="tot">
            <div class="lbl">${isSavings?'Net Saving':'Monthly Spend'}</div>
            <div class="val" style="color:${isSavings?'var(--green)':'var(--amber)'}">${fabs(Math.abs(diff))}</div>
          </div>`:''}
        </div>
        <div class="month-actions">
          <button class="edit-btn" onclick="editMonth(${idx})">Edit</button>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

function toggleCard(idx) {
  document.getElementById('hdr-'+idx).classList.toggle('open');
  document.getElementById('body-'+idx).classList.toggle('open');
}
function editMonth(idx) {
  document.getElementById('monthSelect').value=idx;
  showForm();
  window.scrollTo({top:0,behavior:'smooth'});
}
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

init();
</script>
